# Database servers for the API test suite, at the oldest supported versions:
#
#   docker compose -f docker-compose.test-db.yml up -d --wait
#   TEST_POSTGRES_URL=postgres://postgres:test@127.0.0.1:5432/postgres \
#   TEST_MYSQL_URL=mysql://root:test@127.0.0.1:3306/mysql pnpm --filter @investor/api test
#
# Each test creates and drops its own database on these servers. Ports bind to 127.0.0.1 only; the
# throwaway password is for tests. TEST_POSTGRES_PORT / TEST_MYSQL_PORT move the host ports.

name: investor-test-db

services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_PASSWORD: test
    ports:
      - 127.0.0.1:${TEST_POSTGRES_PORT:-5432}:5432
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, postgres]
      interval: 2s
      timeout: 5s
      retries: 30

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: test
    ports:
      - 127.0.0.1:${TEST_MYSQL_PORT:-3306}:3306
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1, -uroot, -ptest]
      interval: 2s
      timeout: 5s
      retries: 60
