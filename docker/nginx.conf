# Serves the web UI and proxies /api to the api service, so the browser sees one origin (like the Vite
# dev proxy) and the player cookie stays first-party.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Docker's embedded DNS. Resolving per request (via the variable below) survives the api container
  # being recreated with a new IP, and lets nginx start before `api` resolves.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3001;

  location /api/ {
    # A variable without a URI part passes the original request URI through unchanged.
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The API trusts exactly one hop (TRUST_PROXY=1) and reads the address appended here.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A negotiation turn can wait on slow LLM providers (60 s timeouts plus retries).
    proxy_connect_timeout 10s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;
  }

  # Vite's content-hashed bundles never change under the same name.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Always revalidated, so a new deployment takes effect on the next load.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
  }

  # Client-side routes (/games/:id, ...) fall back to the SPA shell.
  location / {
    add_header X-Content-Type-Options nosniff always;
    try_files $uri /index.html;
  }
}
