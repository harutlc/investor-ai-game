# Runs the stack against PostgreSQL instead of SQLite:
#
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up --build
#
# The database lives on its own named volume and is reachable only on the Compose network. Set
# DOCKER_DB_PASSWORD in .env to change the password (URL-safe characters only, as it goes into
# DATABASE_URL); the default is for local use only.

services:
  api:
    environment:
      DATABASE_DIALECT: postgres
      DATABASE_URL: postgres://game:${DOCKER_DB_PASSWORD:-game-local-only}@postgres:5432/game
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: game
      POSTGRES_PASSWORD: ${DOCKER_DB_PASSWORD:-game-local-only}
      POSTGRES_DB: game
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, game, -d, game]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10

volumes:
  postgres-data:
